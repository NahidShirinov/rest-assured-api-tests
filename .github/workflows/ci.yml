# CI: hər push və pull request zamanı framework-ün unit testləri işləyir (API lazım deyil).
name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Framework unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn -B test -Dsuite.xml=testng-unit.xml

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/
