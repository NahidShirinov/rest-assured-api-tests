# Framework unit testləri hər push və pull request zamanı GitHub-da avtomatik işləyir.
# API testləri burada işləmir: onlara localhost:8090 lazımdır (yalnız öz kompüterində).
name: Framework unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn -B test -Dsuite.xml=testng-unit.xml

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
