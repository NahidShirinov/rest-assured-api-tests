# ===== DEV mühiti =====
# Sadəcə bu URL-i öz API-nizə dəyişin
base.url=http://localhost:8090

# none | bearer | basic | apikey
auth.type=none
# auth.token=${TOKEN}   -> daha yaxşısı: ENV-dən ötürün: export AUTH_TOKEN=...
# auth.header=X-API-Key
# auth.username=
# auth.password=

timeout.ms=15000
# true = bütün request/response-ları logla (default: yalnız uğursuz olanlar)
log.all=false

# ----- DB yoxlaması ("db": {...}) -----
# Card Status servisinin lokal docker-compose bazası (card-status-pipeline-test/docker-compose.yml).
# Bunlar yalnız lokal Docker üçün default dəyərlərdir; real mühitdə şifrəni ENV ilə ver: DB_PASSWORD=...
db.url=jdbc:postgresql://localhost:5432/carddb
db.user=carduser
db.password=cardpass
# Bir neçə baza: db.<ad>.url / db.<ad>.user / db.<ad>.password  ->  "db": {"datasource": "<ad>", ...}

# ----- OpenAPI yoxlaması ("openapi": true) -----
openapi.spec=http://localhost:8090/v3/api-docs

# ----- Faker dili (${faker.*}) -----
# faker.locale=en
