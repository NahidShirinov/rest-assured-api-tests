# Framework unit testləri üçün kiçik OpenAPI spesifikasiyası (LocalApi serveri bunu təqlid edir)
openapi: 3.0.3
info:
  title: Users API
  version: "1.0"
servers:
  - url: /
paths:
  /users:
    post:
      summary: Create user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{id}:
    get:
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /jobs/{id}:
    get:
      operationId: getJob
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: verbose
          in: query
          required: true
          schema: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [RUNNING, DONE] }
  /orders:
    get:
      operationId: listOrders
      parameters:
        # Spring Data Pageable kimi: obyekt, amma URL-də ?page=&size=&sort= olaraq gedir
        - name: pageable
          in: query
          required: true
          schema:
            type: object
            properties:
              page: { type: integer, minimum: 0 }
              size: { type: integer, minimum: 1 }
              sort: { type: array, items: { type: string } }
        - name: filter
          in: query
          required: true
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [NEW, PAID] }
              note: { type: string }
        - name: tags
          in: query
          required: true
          schema:
            type: array
            items: { type: string, enum: [urgent, gift] }
      responses:
        "200":
          description: ok
components:
  schemas:
    NewUser:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [USER, ADMIN] }
        address:
          type: object
          properties:
            city: { type: string }
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
